name: Feature proposal
description: Propose a scoped, testable product capability
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
      description: Describe the concrete use case, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Define the minimum coherent release and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specify observable behavior, permissions, error conditions and success criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Constraints and alternatives
      description: Include persistence, privacy, platform permissions, migrations and known dependencies.
