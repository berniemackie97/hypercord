name: Bug report
description: Report a reproducible regression in Hypercord
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including exact command or service?
      placeholder: "Describe the failure and its impact."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include environment, prerequisites, commands, and a minimal sequence.
      placeholder: "1. Configure ...\n2. Execute ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the observable correctness contract.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - "P0 - Data loss, security, deployment or critical operation"
        - "P1 - Major feature failure or correctness risk"
        - "P2 - Limited impact or documented workaround"
        - "P3 - Cosmetic or minor inconvenience"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redacted logs, relevant code paths, tests, screenshots or trace IDs. Never post secrets.
  - type: textarea
    id: verification
    attributes:
      label: Verification criteria
      description: How should the regression be proven fixed?
