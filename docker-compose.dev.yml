services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: build
    command: ["pnpm", "--filter", "@hypercord/bot", "dev"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/bot/src:/app/apps/bot/src:ro
